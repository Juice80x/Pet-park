function startEncounter(d){if(G.state!=='world'||d.leave)return;keysClear();G.tr={t:0,d};d.hop=.35;sfx.bark(d.b.sz);setState('trans');actB.classList.remove('on')}
function beginPhoto(d){const b=d.b;G.ph={d,b,x:-vw/2-50,tx:0,v:[44,58,74,92][b.r],pause:0,film:3,t:0,flash:0,done:false,stars:0,dir:1,first:true};setState('photo');updMh();

function updMh(){if(G.state==='photo'&&G.ph)mh.textContent='Film '+'●'.repeat(G.ph.film)+'○'.repeat(3-G.ph.film)+'   ✕ leave';
 else if(G.state==='mini'&&MINI)mh.textContent=MINI.hud()+'   ✕'}
function snap(){const p=G.ph;if(!p||p.done||p.t<.6)return;p.film--;p.flash=1;sfx.shutter();updMh();const a=Math.abs(p.x),st=a<7?3:a<18?2:a<33?1:0;
 if(st){p.done=true;p.stars=st;p.pause=9;setTimeout(()=>photoResult(p),700)}
 else if(p.film<=0){p.done=true;toast('Out of film! It trotted off…');setTimeout(endPhoto,1000)}
 else toast('Missed! Wait for it to reach the middle.')}
function photoResult(p){const b=p.b,old=S.dogs[b.id],isNew=!old;let tr;
 if(isNew){tr=10*p.stars+[0,10,25,60][b.r];S.dogs[b.id]={name:pick(NAMES),stars:p.stars,bond:0,hat:'',neck:'',eyes:'',n:1}}
 else{tr=2*p.stars+(p.stars>old.stars?5:0);old.n=(old.n||1)+1;if(p.stars>old.stars)old.stars=p.stars}
 S.treats+=tr;let extra='';
 if(!S.buddy){S.buddy=b.id;BUD.on=false;extra='<p>It wants to walk with you!</p>'}
 if(count()===BR.length&&isNew)extra+='<p>DOGDEX COMPLETE! You legend.</p>';
 save();sfx.jingle();
 const c=mk(80,72),x=c.x,per=period(hourNow());px(x,0,0,80,50,{M:'#ffd6a0',D:'#8fd3ff',E:'#f7a66b',N:'#232c66'}[per]);px(x,0,46,80,26,'#4aa63c');for(let i=0;i<10;i++)disc(x,i*9+2,45,5,'#2f7d32');px(x,0,50,80,1,'#3c8c38');
 x.drawImage(dogFront(b,0,S.dogs[b.id],true),7,-16,66,88);
 if(per==='N'){x.globalCompositeOperation='multiply';px(x,0,0,80,72,'#9aa4e0');x.globalCompositeOperation='source-over'}
 G.cur=b.id;
 openPanel(`<h2>${isNew?'New Dogdex entry!':'Nice shot!'}</h2><div class="card">${im(c,3)}<p style="margin:4px 0 0;color:#333">${b.n}</p></div>
 <div class="stars">${stars(p.stars)}</div><p><span class="tag" style="background:${RAR[b.r][1]}">${RAR[b.r][0]}</span> &nbsp; +${tr} ${bone()}</p>${isNew?`<p><i>${b.d}</i></p><p>Give it a name:</p><input id="nm" maxlength="12" value="${S.dogs[b.id].name}" aria-label="Name" autocomplete="off">`:''}${extra}
 <button class="btn" data-a="ok">${isNew?'Save name':'OK'}</button>`);
 if(isNew&&S.tips<1){S.tips=1;save();setTimeout(()=>toast('Tap the clock to open your Dogdex.',5000),1500)}}
function endPhoto(){const p=G.ph;if(p){const d=p.d;d.happy=p.stars?2:0;d.leave=true;d.t=p.stars?3.5:2;d.st='sit'}G.ph=null;setState('world')}

 else MINI=Object.assign(base,{name:'Fetch',tip:'Hold to charge · release to throw at the target',round:0,ph:'aim',pw:0,pd:1,bx:0,by:0,vx:0,vy:0,dx:0,cam:0,wind:0,tz:0,wait:0,run:0,

function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*vw,y:(e.clientY-r.top)/r.height*vh}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();const p=pos(e);
 if(G.state==='photo')return snap();
 if(G.state==='mini'){if(MINI)MINI.down(p.x,p.y);return}
 if(G.state!=='world'||G.paused)return;
 ptr.id=e.pointerId;ptr.sx=ptr.x=p.x;ptr.sy=ptr.y=p.y;ptr.t=performance.now();ptr.drag=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const p=pos(e);if(G.state==='mini'&&MINI){MINI.move(p.x,p.y);return}
 if(e.pointerId!==ptr.id)return;ptr.x=p.x;ptr.y=p.y;if(Math.hypot(p.x-ptr.sx,p.y-ptr.sy)>4)ptr.drag=true});
const pup=e=>{if(e.pointerId!==ptr.id)return;const p=pos(e);if(!ptr.drag&&performance.now()-ptr.t<400)tapWorld(p.x,p.y);ptr.id=null};

function tapWorld(x,y){const wx=x+G.cam.x,wy=y+G.cam.y;

function resize(){const iw=innerWidth,ih=innerHeight,dpr=Math.min(3,devicePixelRatio||1);K=Math.max(2,Math.round(Math.min(iw,ih)*dpr/150));

/* ================= update ================= */
let saveT=0;
function update(dt){G.time+=dt;
 G.dt=dt;if(G.state==='mini'){miniUpdate(dt);return}
 if(G.state==='title')return;
 if(G.state==='photo'){updPhoto(dt);return}
 if(G.state==='trans'){const t=G.tr;t.t+=dt;t.d.hop=Math.max(0,t.d.hop-dt);if(t.t>.95)beginPhoto(t.d);return}
 if(G.state!=='world'||G.paused){P.moving=false;P.vx=P.vy=0;return}
 // player
 let mx=0,my=0;
 if(keys.arrowleft||keys.a)mx--;if(keys.arrowright||keys.d)mx++;if(keys.arrowup||keys.w)my--;if(keys.arrowdown||keys.s)my++;
 let str=1;
 if(ptr.id!==null&&ptr.drag){const dx=ptr.x-ptr.sx,dy=ptr.y-ptr.sy,m=Math.hypot(dx,dy);if(m>3){mx=dx/m;my=dy/m;str=clamp(m/16,.35,1);if(m>24){ptr.sx=ptr.x-mx*24;ptr.sy=ptr.y-my*24}}}
 const m=Math.hypot(mx,my),kk=Math.min(1,dt*13),tvx=m>0?mx/m*76*str:0,tvy=m>0?my/m*76*str:0;
 P.vx+=(tvx-P.vx)*kk;P.vy+=(tvy-P.vy)*kk;const spd=Math.hypot(P.vx,P.vy);P.moving=spd>5;
 const nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;if(!blocked(nx,P.y))P.x=nx;else P.vx=0;if(!blocked(P.x,ny))P.y=ny;else P.vy=0;
 if(m>0){if(Math.abs(mx)>Math.abs(my)){P.dir=2;P.flip=mx<0}else P.dir=my<0?1:0}
 if(P.moving)P.anim+=spd*dt;else P.anim=0;
 // zone
 const z=zoneAt(P.x>>4,P.y>>4);if(z!==G.zone){if(G.zone)toast('~ '+ZNAME[z].replace(/^the /,'The ')+' ~',1800);G.zone=z}
 // dogs
 let near=null,nd=30;
 for(const d of dogs){d.life-=dt;d.hop=Math.max(0,d.hop-dt);const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy);
  const on=Math.abs(dx)<vw/2+20&&Math.abs(dy)<vh/2+30;
  if(d.leave){d.t-=dt;d.happy=Math.max(0,d.happy-dt);if(d.happy<=0){d.st='walk';const a=Math.atan2(-dy,-dx),nx=d.x+Math.cos(a)*85*dt,ny=d.y+Math.sin(a)*85*dt;d.dir=Math.cos(a)>0?1:-1;if(!solidAt(nx,d.y-2))d.x=nx;if(!solidAt(d.x,ny-2))d.y=ny}
   if(d.t<=0&&(!on||d.t<-4))spawnDog(d,true);continue}
  if(dist<30){if(!d.near){d.near=true;d.hop=.25;if(on)sfx.pop()}d.st='sit';d.dir=dx>0?1:-1;if(dist<nd){nd=dist;near=d}}
  else{d.near=false;d.t-=dt;
   if(d.st==='sit'){if(d.t<=0){const tx=d.x+(R()*2-1)*56,ty=d.y+(R()*2-1)*56;if(!solidAt(tx,ty-2)&&reach[I(tx>>4,ty>>4)]){d.tx=tx;d.ty=ty;d.st='walk';d.t=4}else d.t=.5}}
   else{const ax=d.tx-d.x,ay=d.ty-d.y,am=Math.hypot(ax,ay);if(am<2||d.t<=0){d.st='sit';d.t=1.5+R()*4}else{const sp=(d.b.sz===0?30:24)*dt,nx=d.x+ax/am*sp,ny=d.y+ay/am*sp;if(solidAt(nx,ny-2)){d.st='sit';d.t=1}else{d.x=nx;d.y=ny;if(Math.abs(ax)>1)d.dir=ax>0?1:-1}}}}
  if(d.life<=0&&!on)spawnDog(d,true)}
 if(near!==G.near){G.near=near;actB.classList.toggle('on',!!near)}
 // buddy
 if(S.buddy&&S.dogs[S.buddy]){if(!BUD.on){BUD.on=true;BUD.x=P.x-14;BUD.y=P.y+2}
  BUD.hop=Math.max(0,BUD.hop-dt);const dx=P.x-BUD.x,dy=P.y-BUD.y,dist=Math.hypot(dx,dy);
  if(dist>160){BUD.x=P.x-12;BUD.y=P.y}else if(dist>20){const sp=Math.min(95,dist*3.2)*dt;BUD.x+=dx/dist*sp;BUD.y+=dy/dist*sp;BUD.moving=true;if(Math.abs(dx)>2)BUD.dir=dx>0?1:-1}else BUD.moving=false}else BUD.on=false;
 for(const f of G.fx)f.t-=dt;G.fx=G.fx.filter(f=>f.t>0);
 saveT+=dt;if(saveT>10){saveT=0;S.pos=[P.x,P.y];save()}}
function updPhoto(dt){const p=G.ph;if(!p)return;p.t+=dt;p.flash=Math.max(0,p.flash-dt*3);if(p.done)return;
 const Rg=Math.min(vw/2-14,80);
 if(p.pause>0){p.pause-=dt;if(p.pause<=0){p.tx=R()<.3?(R()*2-1)*8:(R()*2-1)*Rg;p.first=false}}
 else{const d=p.tx-p.x,st=p.v*dt;if(Math.abs(d)<=st){p.x=p.tx;p.pause=p.first?1.1:.25+R()*(.9-p.b.r*.15)}else{p.x+=Math.sign(d)*st;p.dir=Math.sign(d)}}}

/* ================= render ================= */
function spr(c,x,y,s,flip){const w=c.width*s,h=c.height*s,X=sn(x-w/2),Y=sn(y-(c.height-1)*s);
 if(flip){g.save();g.translate(X+w,Y);g.scale(-1,1);g.drawImage(c,0,0,w,h);g.restore()}else g.drawImage(c,X,Y,w,h)}

function drawScene(sc){sc=sc||0;const per=period(hourNow()),gy=gY(),sky={M:['#ffd6a0','#aee0ff'],D:['#6cc0ff','#c4e8ff'],E:['#f58f5c','#ffd48a'],N:['#10163a','#2a3470']}[per];
 const gr=g.createLinearGradient(0,0,0,gy);gr.addColorStop(0,sky[0]);gr.addColorStop(1,sky[1]);g.fillStyle=gr;g.fillRect(0,0,vw,gy);
 if(per==='N'){const r=rng(9);for(let i=0;i<40;i++)px(g,r()*vw|0,r()*gy*.8|0,1,1,(G.time*2+i)%5<4?'#fff':'#8a94c8');disc(g,vw-26,22,9,'#f4f0d0');disc(g,vw-22,19,8,sky[0])}
 else{disc(g,vw-26,per==='D'?22:gy-40,9,per==='D'?'#fff4a0':'#ffe0a0');const cx=(G.time*4)%(vw+60)-30;ell(g,cx|0,30,14,4,'#fff');ell(g,(cx+8)|0,26,8,4,'#fff');ell(g,((cx+vw*.6)%(vw+60)-30)|0,52,11,3,'#fff')}
 const ho=sn((sc*.5)%13),hi=Math.floor(sc*.5/13);for(let i=-1;i<vw/13+2;i++){const j=Math.abs(i+hi);disc(g,i*13+6-ho,gy-5+((j*7)%3),10,'#2f7d32');disc(g,i*13+4-ho,gy-9+((j*5)%3),5,'#3d9a3a')}
 px(g,0,gy-3,vw,vh-gy+3,'#4aa63c');px(g,0,gy-3,vw,1,'#3c8c38');
 const r=rng(3);for(let i=0;i<vw*(vh-gy)/160;i++){const W=Math.ceil(vw)+4,a=sn(((r()*W-sc)%W+W)%W)-2,b=gy+r()*(vh-gy)|0;px(g,a,b,1,2,'#62c04c');px(g,a+2,b,1,2,'#62c04c');px(g,a+1,b+1,1,1,'#62c04c')}
 if(per==='N'){g.fillStyle='rgba(20,26,90,.38)';g.fillRect(0,gy-18,vw,vh)}}
function drawPhoto(){const p=G.ph;drawScene();if(!p)return;const gy=gY()+12,cx=vw/2,b=p.b;
 const moving=p.pause<=0&&!p.done;shadow(cx+p.x,gy,22);
 spr(moving?dogSide(b,1+((G.time*10|0)%4),null,1):dogFront(b,(G.time%3<.12)?2:(G.time*5&1),null,true),cx+p.x,gy-(moving?0:Math.abs(Math.sin(G.time*6))*2|0),3,p.dir<0);
 // letterbox + viewfinder
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,vw,14);g.fillRect(0,vh-14,vw,14);
 const fw=44,ft=Math.max(18,gy-122),fb=gy+10,L=sn(cx-fw),Rr=sn(cx+fw),inF=Math.abs(p.x)<33,col=Math.abs(p.x)<7?'#ffd84a':inF?'#8fff6a':'#fff';
 const br=(x,y,sx,sy)=>{g.fillStyle='#000';g.fillRect(Math.min(x,x+11*sx)-1,y-1,13,3);g.fillRect(x-1,Math.min(y,y+11*sy)-1,3,13);g.fillStyle=col;g.fillRect(Math.min(x,x+11*sx),y,11,1);g.fillRect(x,Math.min(y,y+11*sy),1,11)};
 br(L,ft,1,1);br(Rr,ft,-1,1);br(L,fb,1,-1);br(Rr,fb,-1,-1);
 px(g,sn(cx)-3,(ft+fb>>1),7,1,col);px(g,sn(cx),(ft+fb>>1)-3,1,7,col);if(Math.abs(p.x)<7&&!p.done)txt('PERFECT!',cx,ft-2,7,'#ffd84a');
 if((G.time*2&1))px(g,6,5,4,4,'#e02a2a');
 if(p.flash>0){g.fillStyle=`rgba(255,255,255,${p.flash})`;g.fillRect(0,0,vw,vh)}
 if(p.t<.4)iris(cx,vh/2,p.t/.4)}
function iris(x,y,k){const r=Math.max(vw,vh)*k;g.fillStyle='#000';g.beginPath();g.rect(0,0,vw,vh);g.arc(x,y,Math.max(0,r),0,6.283,true);g.fill('evenodd')}
function render(){
 g.setTransform(K,0,0,K,0,0);g.imageSmoothingEnabled=false;
 if(G.state==='title')return drawTitle();
 if(G.state==='photo')return drawPhoto();
 if(G.state==='mini'&&MINI)return miniDraw();
 const cam=G.cam,ctx2=clamp(P.x-vw/2,0,MW*TS-vw),cty=clamp(P.y-12-vh/2,0,MH*TS-vh);
 if(cam.fx===undefined||Math.abs(ctx2-cam.fx)>90||Math.abs(cty-cam.fy)>90){cam.fx=ctx2;cam.fy=cty}else{const q=Math.min(1,(G.dt||.016)*9);cam.fx+=(ctx2-cam.fx)*q;cam.fy+=(cty-cam.fy)*q}
 cam.x=clamp(sn(cam.fx),0,MW*TS-vw);cam.y=clamp(sn(cam.fy),0,MH*TS-vh);
 g.drawImage(ground,cam.x,cam.y,vw,vh,0,0,vw,vh);
 // water sparkle
 for(let i=0;i<24;i++){const hsh=Math.sin(i*91.7+Math.floor(G.time*2+i*.37)*13.1)*43758.5,fx=(hsh-Math.floor(hsh))*vw|0,h2=hsh*1.7,fy=(h2-Math.floor(h2))*vh|0;if(map[I((fx+cam.x)>>4,(fy+cam.y)>>4)]===2)px(g,fx,fy,3,1,'#bfe8ff')}
 const L=[];
 for(const o of objs){if(o.y<cam.y-6)continue;if(o.y>cam.y+vh+56)break;if(o.x>cam.x-32&&o.x<cam.x+vw+32)L.push(o)}
 for(const d of dogs)if(Math.abs(d.x-P.x)<vw+40&&Math.abs(d.y-P.y)<vh+40)L.push(d);
 L.push(P);if(BUD.on)L.push(BUD);
 L.sort((a,b)=>a.y-b.y);
 for(const o of L){const x=o.x-cam.x,y=o.y-cam.y;
  if(o===P){shadow(x,y,6);const i=(P.anim/8|0)%4,f=P.moving?[1,0,2,0][i]:0;spr(playerSpr(P.dir,f),x,y-(P.moving&&(i&1)?1:0),1,P.dir===2&&P.flip)}
  else if(o===BUD){const b=BY[S.buddy],dd=S.dogs[S.buddy];shadow(x,y,b.sz*2+7);spr(BUD.moving?dogSide(b,1+((G.time*11|0)%4),dd,1):dogFront(b,(G.time+1.3)%4<.15?2:(G.time*3&1),dd,true),x,y-(BUD.hop>0?4:0),1,BUD.moving&&BUD.dir<0)}
  else if(o.b){const b=o.b,hop=o.hop>0?Math.sin(o.hop*12)*4:0;shadow(x,y,b.sz*2+7);
   spr(o.st==='walk'?dogSide(b,1+(((G.time*(o.leave?14:8)+o.seed)|0)%4),null,o.leave):dogFront(b,(o.near||o.happy>0)?(G.time*6&1):((G.time+o.seed)%4<.15?2:(G.time+o.seed)%3<.3?1:0),null,o.near||o.happy>0),x,y-Math.abs(hop),1,o.st==='walk'&&o.dir<0)}
  else if(o.k==='tree')g.drawImage(SPR.tree[o.v],x-17,y-44);
  else if(o.k==='bush')g.drawImage(SPR.bush,x-9,y-14);
  else if(o.k==='rock')g.drawImage(SPR.rock,x-7,y-10);
  else if(o.k==='bench')g.drawImage(SPR.bench,x-17,y-19);
  else if(o.k==='hurdle')g.drawImage(SPR.hurdle,x-15,y-16);
  else if(o.k==='lamp')g.drawImage(SPR.lamp,x-6,y-34);
  else if(o.k==='fountain'){g.drawImage(SPR.fountain,x-29,y-52);const t=G.time*6|0;for(let i=0;i<5;i++){const a=(i*1.3+t*.7)%6.28;px(g,x+Math.cos(a)*(6+(t+i)%5)|0,y-36+((t*3+i*7)%14),1,2,'#dff4ff')}}}
 // day / night
 const h=hourNow(),tc=tint(h),night=clamp((255-(tc[0]+tc[1])/2)/150,0,1);
 if(night>0.01){g.globalCompositeOperation='multiply';g.fillStyle=`rgb(${tc[0]},${tc[1]},${tc[2]})`;g.fillRect(0,0,vw,vh);g.globalCompositeOperation='source-over'}
 if(night>.25){g.globalCompositeOperation='lighter';
  for(const[lx,ly]of lamps){const x=lx-cam.x,y=ly-cam.y;if(x<-50||y<-50||x>vw+50||y>vh+50)continue;for(const rr of[48,42,36,30,24,18,12,6])disc(g,x|0,y|0,rr,`rgba(255,206,120,${.065*night})`)}
  g.globalCompositeOperation='source-over';
  for(let i=0;i<14;i++){const fx=(Math.sin(i*12.9)*.5+.5)*vw+Math.sin(G.time*.7+i)*14,fy=(Math.cos(i*7.3)*.5+.5)*vh+Math.cos(G.time*.9+i*2)*10;if(Math.sin(G.time*2+i*1.7)>-.2)px(g,fx|0,fy|0,1,1,'#f8ff9a')}}
 // bubbles
 for(const d of dogs){if(!d.near&&d.happy<=0)continue;const x=d.x-cam.x,y=d.y-cam.y-[27,32,37][d.b.sz]-(d.b.tall?3:0);

 for(const f of G.fx)g.drawImage(SPR.heart,Math.round(f.x-cam.x-4),Math.round(f.y-cam.y-(1-f.t)*14));
 // joystick
 if(ptr.id!==null&&ptr.drag&&G.state==='world'){g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.beginPath();g.arc(ptr.sx,ptr.sy,14,0,6.283);g.stroke();g.fillStyle='rgba(255,255,255,.55)';const dx=ptr.x-ptr.sx,dy=ptr.y-ptr.sy,m=Math.max(1,Math.hypot(dx,dy)),k=Math.min(14,m)/m;g.beginPath();g.arc(ptr.sx+dx*k,ptr.sy+dy*k,5,0,6.283);g.fill()}
