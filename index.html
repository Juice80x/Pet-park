<style>

html,body{margin:0;height:100%;overflow:hidden;background:#1c3a1c;touch-action:none;overscroll-behavior:none;

 padding:6px 10px;font-size:13px;max-width:86vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}

 padding:5px 10px;font-size:13px;display:none;z-index:6;white-space:nowrap;cursor:pointer}

 padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}

 width:min(100%,430px);max-height:100%;overflow-y:auto;padding:12px;text-align:center;touch-action:pan-y;-webkit-overflow-scrolling:touch}

h2{font-size:18px;margin:2px 0 8px}

 box-shadow:inset -3px -3px 0 #c06a1e,inset 3px 3px 0 #ffb866;padding:10px 8px;cursor:pointer}
.btn:active{box-shadow:inset 3px 3px 0 #c06a1e}
.btn.alt{background:#e9c583;box-shadow:inset -3px -3px 0 #c9a05a,inset 3px 3px 0 #fff0c8}
.btn.sm{display:inline-block;width:auto;font-size:12px;padding:6px 7px;margin:3px 2px 0}
.btn.on{background:#8fd35a;box-shadow:inset -3px -3px 0 #5a9a34,inset 3px 3px 0 #c8f09a}
.btn.lock{background:#cdb48a;box-shadow:inset -3px -3px 0 #a58c62,inset 3px 3px 0 #e8d6b0;color:#6a5030}
.row{display:flex;flex-wrap:wrap;gap:0 2px;justify-content:flex-start}
.two{display:flex;gap:8px}.two .btn{flex:1}

.cell{font:inherit;font-size:10px;overflow:hidden;color:#5a2a0a;background:#fbe6b8;border:3px solid #b9753a;padding:3px 1px 4px;cursor:pointer;line-height:1.1;min-height:92px}
.cell.un{background:#e3c58c;color:#8a6a40}
.cell i{display:block;font-style:normal;font-size:9px}
.card{background:#fff;border:3px solid #7a3e12;padding:8px 8px 4px;margin:6px auto;display:inline-block;transform:rotate(-2deg);box-shadow:4px 5px 0 rgba(0,0,0,.25)}
.card img{display:block;border:2px solid #333}
.stars{color:#e89a1a;font-size:22px;letter-spacing:2px}
.tag{display:inline-block;padding:1px 6px;color:#fff;font-size:11px}
.cy{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;font-size:13px}
.cy .btn{width:44px;margin:0;padding:6px 0}
.cy span{flex:1}
input{font:inherit;font-size:16px;text-align:center;background:#fff7e0;border:3px solid #7a3e12;color:#5a2a0a;padding:5px;width:70%;-webkit-user-select:text;user-select:text}
.c{margin:4px 0}
.tr{font-size:14px;margin:4px 0}
.logo,#playB,.tagl{font-family:"Arial Rounded MT Bold","Chalkboard SE","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:900}
#title{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:min(2.4vh,14px);z-index:8;padding:0 0 26vh;overflow:hidden;text-align:center}
body[data-s=title] #title{display:flex}
.logo{font-size:min(27vw,20vh);line-height:.92;text-align:center;width:100%;position:relative;filter:drop-shadow(.035em 0 0 #fff) drop-shadow(-.035em 0 0 #fff) drop-shadow(0 .035em 0 #fff) drop-shadow(0 -.035em 0 #fff) drop-shadow(0 .08em .06em rgba(0,0,0,.35))}
.logo div{display:flex;justify-content:center}
#burst{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(rgba(255,255,255,.16) 0 9deg,rgba(255,255,255,0) 9deg 18deg);-webkit-mask-image:radial-gradient(closest-side,#000 0,#000 18%,transparent 55%);mask-image:radial-gradient(closest-side,#000 0,#000 18%,transparent 55%);animation:spin 40s linear infinite;pointer-events:none;z-index:-1}
@keyframes spin{to{rotate:360deg}}
.logo span{display:inline-block;-webkit-text-stroke:.16em #4a1f04;paint-order:stroke fill;text-shadow:0 .1em 0 #4a1f04,0 .17em 0 rgba(0,0,0,.28);animation:bobl 1.5s ease-in-out infinite}
.logo span:nth-child(odd){color:#ffd23a;transform:rotate(-5deg)}.logo span:nth-child(even){color:#ff8a2a;transform:rotate(4deg)}
.logo div:nth-child(2) span:nth-child(odd){color:#fff}.logo div:nth-child(2) span:nth-child(even){color:#7fe04a}
.logo span:nth-child(2){animation-delay:.15s}.logo span:nth-child(3){animation-delay:.3s}.logo span:nth-child(4){animation-delay:.45s}
@keyframes bobl{0%,100%{translate:0 0}50%{translate:0 -.07em}}
.tagl{color:#fff;font-size:min(4.2vw,3vh);-webkit-text-stroke:.3em #4a1f04;paint-order:stroke fill;text-align:center}
#playB{font-size:min(9.5vw,7.5vh);color:#fff;background:linear-gradient(#7fe04a,#3aa82e);border:.11em solid #1f5a1a;border-radius:99px;padding:.28em 1.1em .3em;margin-top:.2em;
 box-shadow:0 .16em 0 #1f5a1a,0 .3em .3em rgba(0,0,0,.3),inset 0 .09em 0 rgba(255,255,255,.5);-webkit-text-stroke:.12em #1f5a1a;paint-order:stroke fill;cursor:pointer;animation:pulse 1.1s ease-in-out infinite;display:flex;align-items:center;gap:.3em}
#playB:active{transform:translateY(.1em);box-shadow:0 .06em 0 #1f5a1a}
#playB i{width:0;height:0;border-left:.62em solid #fff;border-top:.4em solid transparent;border-bottom:.4em solid transparent;filter:drop-shadow(.05em .05em 0 #1f5a1a)}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.07}}
#tsub{min-height:1em}
@media (orientation:landscape){#title{padding-bottom:4vh;gap:4px}.logo{font-size:min(15vw,23vh)}#playB{font-size:min(6vw,9vh)}#charB{font-size:min(3vw,5vh)}}
#charB{font-family:"Arial Rounded MT Bold","Chalkboard SE","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-weight:900;font-size:min(5vw,3.8vh);color:#4a1f04;background:linear-gradient(#ffe08a,#f2b23a);border:.14em solid #7a3e12;border-radius:99px;padding:.35em 1.1em;box-shadow:0 .16em 0 #7a3e12,0 .3em .3em rgba(0,0,0,.25);cursor:pointer}
#dexB{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));display:none;align-items:center;gap:6px;font:inherit;font-size:12px;color:#5a2a0a;
 background:#f6d79b;border:3px solid #7a3e12;box-shadow:0 0 0 2px #d98a3a,0 3px 0 2px rgba(0,0,0,.3);padding:5px 8px;cursor:pointer;z-index:5}
body[data-s=world] #dexB{display:flex}
#pet{position:fixed;top:calc(54px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:96vw;
 background:#f6d79b;border:3px solid #7a3e12;box-shadow:0 0 0 2px #d98a3a,0 3px 0 2px rgba(0,0,0,.3);padding:5px 6px;font-size:13px;z-index:6}
body[data-s=world] #pet.on{display:flex}
#pet b{padding:0 4px;width:100%;text-align:center}
#pet button{font:inherit;font-size:12px;color:#4a1f04;background:#e8923a;border:2px solid #7a3e12;box-shadow:inset -2px -2px 0 #c06a1e,inset 2px 2px 0 #ffb866;padding:6px 6px;cursor:pointer;white-space:nowrap}
#act img{image-rendering:pixelated}
</style>

<body data-s="title">

<script>
'use strict';
(()=>{
/* ================= helpers ================= */
const TS=16,MW=96,MH=96,OUT='#2b1a12';
const $=s=>document.querySelector(s);
const cv=$('#game'),g=cv.getContext('2d');
let vw=160,vh=284,K=6;const sn=v=>Math.round(v*K)/K;
const R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[R()*a.length|0];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=h*31+s.charCodeAt(i)|0;return h}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.x=c.getContext('2d');c.x.imageSmoothingEnabled=false;return c}
function px(x,X,Y,W,H,c){x.fillStyle=c;x.fillRect(X,Y,W,H)}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=clamp((n>>16)*f|0,0,255),gg=clamp((n>>8&255)*f|0,0,255),b=clamp((n&255)*f|0,0,255);return'#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1)}
function outline(c,col){const x=c.x,w=c.width,h=c.height,a=x.getImageData(0,0,w,h).data,o=[],A=(i,y)=>a[(y*w+i)*4+3];
 for(let y=0;y<h;y++)for(let i=0;i<w;i++){if(A(i,y))continue;if((i>0&&A(i-1,y))||(i<w-1&&A(i+1,y))||(y>0&&A(i,y-1))||(y<h-1&&A(i,y+1)))o.push(i,y)}
 x.fillStyle=col||OUT;for(let i=0;i<o.length;i+=2)x.fillRect(o[i],o[i+1],1,1);return c}
function ell(x,cx,cy,rx,ry,col){x.fillStyle=col;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry+.01)));x.fillRect(cx-w,cy+y,w*2+1,1)}}
const disc=(x,cx,cy,r,col)=>ell(x,cx,cy,r,r,col);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const URLS=new Map();
function im(c,s,cls){let u=URLS.get(c);if(!u){u=c.toDataURL();URLS.set(c,u)}return`<img class="px ${cls||''}" src="${u}" width="${c.width*s}" height="${c.height*s}" alt="">`}

/* ================= save ================= */
const SAVE_KEY='pupPark.save.v1';
let S={v:1,started:false,player:{name:'',skin:1,hair:0,hairC:0,beard:1,shirt:7,pants:0},dogs:{},treats:0,owned:['party','bandana'],buddy:'',music:true,sound:true,pos:null,tips:0};
let IDB=null;
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open('pupPark',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{IDB=q.result;r(IDB)};q.onerror=()=>r(null)}catch(e){r(null)}})}
function idbGet(){return new Promise(r=>{if(!IDB)return r(null);try{const q=IDB.transaction('kv').objectStore('kv').get('save');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
function save(){S.ts=Date.now();const j=JSON.stringify(S);try{localStorage.setItem(SAVE_KEY,j)}catch(e){}if(IDB)try{IDB.transaction('kv','readwrite').objectStore('kv').put(j,'save')}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.v===1){Object.assign(S,d)}}catch(e){}}

/* ================= time ================= */
const HO=new URLSearchParams(location.search).get('hour');
function hourNow(){if(HO!==null&&HO!=='')return +HO;const d=new Date();return d.getHours()+d.getMinutes()/60}
const period=h=>h>=5&&h<10?'M':h>=10&&h<17?'D':h>=17&&h<21?'E':'N';
const PNAME={M:'morning',D:'daytime',E:'evening',N:'night'};
const TK=[[0,98,110,182],[4.5,98,110,182],[6,255,196,160],[7.5,255,255,255],[17,255,255,255],[18.75,255,178,128],[20,132,118,186],[21.5,98,110,182],[24,98,110,182]];
function tint(h){for(let i=1;i<TK.length;i++)if(h<=TK[i][0]){const a=TK[i-1],b=TK[i],t=(h-a[0])/(b[0]-a[0]);return[1,2,3].map(k=>lerp(a[k],b[k],t)|0)}return[98,110,182]}

/* ================= breeds ================= */
// sz 0 small 1 medium 2 large · c body · s secondary · e ear · t tail · p pattern · z zones · h periods · r rarity
const BR=[
{id:'lab',n:'Labrador',sz:1,c:'#e3b34f',s:'#f2d48a',e:'flop',t:'long',p:'solid',z:['lawn','pond'],h:'MD',r:0,d:'Will fetch literally anything. Twice.'},
{id:'golden',n:'Golden Retriever',sz:1,c:'#d9892b',s:'#f0b85c',e:'flop',t:'fluff',p:'chest',z:['pond','lawn'],h:'DE',r:0,d:'Has never met a puddle it did not love.'},
{id:'beagle',n:'Beagle',sz:1,c:'#b5692c',s:'#f5efe0',e:'flop',t:'long',p:'patch',col:'#3a6fd8',z:['meadow'],h:'MD',r:0,d:'Follows its nose first, asks questions later.'},
{id:'pug',n:'Pug',sz:0,c:'#dcb98a',s:'#dcb98a',m:'#3a2a22',ec:'#3a2a22',e:'fold',t:'curl',p:'solid',flat:1,col:'#3aa655',z:['lawn'],h:'DE',r:0,d:'Snores louder than it barks.'},
{id:'corgi',n:'Corgi',sz:0,c:'#e09a3c',s:'#fff4e0',e:'point',t:'stub',p:'mask',col:'#3a6fd8',z:['meadow'],h:'D',r:0,d:'Short legs, enormous confidence.'},
{id:'dachs',n:'Dachshund',sz:0,long:1,c:'#8a4a22',s:'#c47a3a',e:'long',t:'long',p:'tan',col:'#f2c230',z:['sand'],h:'DE',r:0,d:'Half a dog high, two dogs long.'},
{id:'poodle',n:'Poodle',sz:1,c:'#f4f0ea',s:'#ffffff',e:'long',t:'pom',top:1,p:'solid',f:1,col:'#e86aa8',z:['lawn'],h:'D',r:0,d:'Knows it is the best dressed dog here.'},
{id:'jack',n:'Jack Russell',sz:0,c:'#f7f2e8',s:'#a8612a',ec:'#a8612a',e:'fold',t:'stub',p:'eyepatch',z:['sand'],h:'M',r:0,d:'Runs on pure zoomies.'},
{id:'boxer',n:'Boxer',sz:1,c:'#c07a3a',s:'#f4ead8',m:'#3a2a22',e:'fold',t:'stub',p:'chest',flat:1,z:['lawn'],h:'M',r:0,d:'Wiggles its whole body to say hello.'},
{id:'mutt',n:'Scruffy Mutt',sz:1,c:'#8d7b68',s:'#b9a892',e:'mix',beard:1,t:'long',p:'solid',f:1,w:14,col:'#f08a2a',z:['any'],h:'MDEN',r:0,d:'A bit of everything. 100% good dog.'},
{id:'dalm',n:'Dalmatian',sz:1,c:'#f8f8f4',s:'#22201e',ec:'#22201e',e:'flop',t:'long',p:'spots',z:['lawn'],h:'D',r:1,d:'Counted its own spots once. Lost track at 12.'},
{id:'collie',n:'Border Collie',sz:1,c:'#26211f',s:'#f6f2ea',e:'fold',t:'fluff',p:'mask',col:'#3ac2c2',z:['meadow'],h:'ME',r:1,d:'Is currently herding you. You just have not noticed.'},
{id:'husky',n:'Husky',sz:1,c:'#7d8794',s:'#f4f6f8',e:'point',t:'curl',p:'mask',eye:'#3aa0e8',col:'#3a6fd8',z:['woods'],h:'EN',r:1,d:'Very dramatic. Sings at the moon.'},
{id:'shep',n:'German Shepherd',sz:2,c:'#c98a3e',s:'#2a211c',m:'#2a211c',ec:'#2a211c',e:'point',t:'fluff',p:'saddle',z:['woods'],h:'EN',r:1,d:'On patrol. Always on patrol.'},
{id:'shiba',n:'Shiba Inu',sz:1,c:'#e2863a',s:'#fff1dc',e:'point',t:'curl',p:'mask',z:['woods'],h:'MD',r:1,d:'Much park. Very sniff. Wow.'},
{id:'kelpie',n:'Kelpie',sz:1,c:'#3a2418',s:'#b5713a',e:'point',t:'long',p:'tan',col:'#f2c230',z:['meadow'],h:'D',r:1,d:'True blue Aussie worker. Never, ever tired.'},
{id:'heeler',n:'Blue Heeler',sz:1,c:'#6f7f92',s:'#c98a4a',e:'point',t:'long',p:'speckle',z:['sand'],h:'DE',r:1,d:'Tough as old boots, soft as a sponge cake.'},
{id:'chi',n:'Chihuahua',sz:0,c:'#e6c89a',s:'#fff6e6',e:'bat',t:'long',p:'chest',col:'#e86aa8',z:['lawn'],h:'E',r:1,d:'Tiny dog. Giant opinions.'},
{id:'french',n:'French Bulldog',sz:0,c:'#4a4038',s:'#e8e0d4',e:'bat',t:'stub',p:'chest',flat:1,col:'#f2c230',z:['lawn'],h:'EN',r:1,d:'Part dog, part bat, part potato.'},

function tone(type,f,t,dur,vol,f2,dest){const c=AU.c;if(!c)return;const o=c.createOscillator(),gn=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(dest||AU.sg);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,vol,dest,hp){const c=AU.c;if(!c)return;const s=c.createBufferSource(),gn=c.createGain();s.buffer=AU.nb;gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
 let n=s;if(hp){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);n=f}n.connect(gn);gn.connect(dest||AU.sg);s.start(t);s.stop(t+dur+.02)}

function musicTick(){const c=AU.c;if(!c||c.state!=='running'||!S.music||G.state==='title')return;
 const per=period(hourNow()),T=per==='N'?TUNES.night:TUNES.day,bpm=per==='M'?120:per==='E'?112:T.bpm,sl=60/bpm/2;
 if(seq.per!==per){seq.per=per;seq.i=0}
 if(seq.next<c.currentTime)seq.next=c.currentTime+.06;
 while(seq.next<c.currentTime+.22){const i=seq.i,t=seq.next,st=i&7,ch=T.ch[(i>>3)%4],n=T.lead[i];
  if(n)tone(T.lw,N(n),t,sl*.9,T.lv,0,AU.mg);
  if(st%2===0)tone('triangle',N(ch[0]-12+(st===4?7:0)),t,sl*1.7,.17,0,AU.mg);
  tone('square',N(ch[st%3]+12),t,sl*.45,.022,0,AU.mg);tone('square',N(ch[(st+1)%3]+12),t+sl/2,sl*.45,.022,0,AU.mg);
  if(T.dr){if(st===0||st===4)tone('triangle',150,t,.1,.24,50,AU.mg);if(st===2||st===6)noise(t,.08,.08,AU.mg,1500);noise(t+sl/2,.02,.025,AU.mg,6000)}
  else if(st===0)noise(t,.25,.012,AU.mg,5000);
  seq.i=(i+1)%T.lead.length;seq.next+=sl}}
