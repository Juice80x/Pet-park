<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1c3a1c;touch-action:none;overscroll-behavior:none;
 font-family:"Courier New",ui-monospace,Menlo,monospace;font-weight:700;color:#5a2a0a}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.px{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle}
#clock{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;align-items:center;gap:6px;
 background:#f6d79b;border:3px solid #7a3e12;box-shadow:0 0 0 2px #d98a3a,0 3px 0 2px rgba(0,0,0,.3);padding:3px 7px;font-size:12px;line-height:1.15;cursor:pointer;z-index:5}
#clock canvas{width:24px;height:24px}
#clock b,#clock span{display:block;text-align:right}
#act{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:68px;height:68px;border-radius:50%;
 background:#e8923a;border:4px solid #7a3e12;box-shadow:inset -4px -4px 0 #c06a1e,inset 4px 4px 0 #ffb866,0 4px 0 rgba(0,0,0,.3);display:none;z-index:5;padding:0;cursor:pointer}
#act img{width:42px}
#act.on{display:block;animation:pop .2s}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f6d79b;border:3px solid #7a3e12;box-shadow:0 0 0 2px #d98a3a;
 padding:6px 10px;font-size:13px;max-width:86vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:6}
#toast.on{opacity:1}
body[data-s=photo] #toast,body[data-s=mini] #toast{bottom:auto;top:calc(50px + env(safe-area-inset-top))}
#mh{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#f6d79b;border:3px solid #7a3e12;box-shadow:0 0 0 2px #d98a3a;
 padding:5px 10px;font-size:13px;display:none;z-index:6;white-space:nowrap;cursor:pointer}
body[data-s=photo] #mh,body[data-s=mini] #mh{display:block}
body[data-s=photo] #clock,body[data-s=mini] #clock,body[data-s=title] #clock,body[data-s=trans] #clock{display:none}
body:not([data-s=world]) #act{display:none!important}
#ui{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,30,20,.45);z-index:10;
 padding:calc(14px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left))}
#ui.on{display:flex}
.panel{background:#f6d79b;border:4px solid #7a3e12;box-shadow:0 0 0 4px #d98a3a,0 0 0 7px #5a2a0a,0 10px 0 7px rgba(0,0,0,.3);
 width:min(100%,430px);max-height:100%;overflow-y:auto;padding:12px;text-align:center;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel.wide{width:min(100%,640px)}
h1{font-size:34px;margin:4px 0;color:#7a3e12;text-shadow:3px 3px 0 #ffb866;letter-spacing:2px}
h2{font-size:18px;margin:2px 0 8px}
h3{font-size:13px;margin:10px 0 4px;text-align:left}
p{font-size:13px;margin:6px 0;line-height:1.35}
.btn{display:block;width:100%;margin:7px 0 0;font:inherit;font-size:15px;color:#4a1f04;background:#e8923a;border:3px solid #7a3e12;
 box-shadow:inset -3px -3px 0 #c06a1e,inset 3px 3px 0 #ffb866;padding:10px 8px;cursor:pointer}
.btn:active{box-shadow:inset 3px 3px 0 #c06a1e}
.btn.alt{background:#e9c583;box-shadow:inset -3px -3px 0 #c9a05a,inset 3px 3px 0 #fff0c8}
.btn.sm{display:inline-block;width:auto;font-size:12px;padding:6px 7px;margin:3px 2px 0}
.btn.on{background:#8fd35a;box-shadow:inset -3px -3px 0 #5a9a34,inset 3px 3px 0 #c8f09a}
.btn.lock{background:#cdb48a;box-shadow:inset -3px -3px 0 #a58c62,inset 3px 3px 0 #e8d6b0;color:#6a5030}
.row{display:flex;flex-wrap:wrap;gap:0 2px;justify-content:flex-start}
.two{display:flex;gap:8px}.two .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;margin-top:6px}
.cell{font:inherit;font-size:10px;color:#5a2a0a;background:#fbe6b8;border:3px solid #b9753a;padding:3px 1px 4px;cursor:pointer;line-height:1.1;min-height:92px}
.cell.un{background:#e3c58c;color:#8a6a40}
.cell i{display:block;font-style:normal;font-size:9px}
.card{background:#fff;border:3px solid #7a3e12;padding:8px 8px 4px;margin:6px auto;display:inline-block;transform:rotate(-2deg);box-shadow:4px 5px 0 rgba(0,0,0,.25)}
.card img{display:block;border:2px solid #333}
.stars{color:#e89a1a;font-size:22px;letter-spacing:2px}
.tag{display:inline-block;padding:1px 6px;color:#fff;font-size:11px}
.cy{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;font-size:13px}
.cy .btn{width:44px;margin:0;padding:6px 0}
.cy span{flex:1}
input{font:inherit;font-size:16px;text-align:center;background:#fff7e0;border:3px solid #7a3e12;color:#5a2a0a;padding:5px;width:70%;-webkit-user-select:text;user-select:text}
.c{margin:4px 0}
.tr{font-size:14px;margin:4px 0}
</style>
</head>

<script>
'use strict';
(()=>{
/* ================= helpers ================= */
const TS=16,MW=96,MH=96,OUT='#2b1a12';
const $=s=>document.querySelector(s);
const cv=$('#game'),g=cv.getContext('2d');
let vw=160,vh=284,zoom=3;
const R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,pick=a=>a[R()*a.length|0];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=7;for(let i=0;i<s.length;i++)h=h*31+s.charCodeAt(i)|0;return h}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.x=c.getContext('2d');c.x.imageSmoothingEnabled=false;return c}
function px(x,X,Y,W,H,c){x.fillStyle=c;x.fillRect(X,Y,W,H)}
function shade(hex,f){const n=parseInt(hex.slice(1),16),r=clamp((n>>16)*f|0,0,255),gg=clamp((n>>8&255)*f|0,0,255),b=clamp((n&255)*f|0,0,255);return'#'+((1<<24)|(r<<16)|(gg<<8)|b).toString(16).slice(1)}
function outline(c,col){const x=c.x,w=c.width,h=c.height,a=x.getImageData(0,0,w,h).data,o=[],A=(i,y)=>a[(y*w+i)*4+3];
 for(let y=0;y<h;y++)for(let i=0;i<w;i++){if(A(i,y))continue;if((i>0&&A(i-1,y))||(i<w-1&&A(i+1,y))||(y>0&&A(i,y-1))||(y<h-1&&A(i,y+1)))o.push(i,y)}
 x.fillStyle=col||OUT;for(let i=0;i<o.length;i+=2)x.fillRect(o[i],o[i+1],1,1);return c}
function ell(x,cx,cy,rx,ry,col){x.fillStyle=col;for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry+.01)));x.fillRect(cx-w,cy+y,w*2+1,1)}}
const disc=(x,cx,cy,r,col)=>ell(x,cx,cy,r,r,col);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const URLS=new Map();
function im(c,s,cls){let u=URLS.get(c);if(!u){u=c.toDataURL();URLS.set(c,u)}return`<img class="px ${cls||''}" src="${u}" width="${c.width*s}" height="${c.height*s}" alt="">`}

/* ================= save ================= */
const SAVE_KEY='pupPark.save.v1';
let S={v:1,started:false,player:{skin:1,hair:0,hairC:0,beard:1,shirt:7,pants:0},dogs:{},treats:0,owned:['party','bandana'],buddy:'',music:true,sound:true,pos:null,tips:0};

/* ================= time ================= */
const HO=new URLSearchParams(location.search).get('hour');
function hourNow(){if(HO!==null&&HO!=='')return +HO;const d=new Date();return d.getHours()+d.getMinutes()/60}
const period=h=>h>=5&&h<10?'M':h>=10&&h<17?'D':h>=17&&h<21?'E':'N';
const PNAME={M:'morning',D:'daytime',E:'evening',N:'night'};
const TK=[[0,98,110,182],[4.5,98,110,182],[6,255,196,160],[7.5,255,255,255],[17,255,255,255],[18.75,255,178,128],[20,132,118,186],[21.5,98,110,182],[24,98,110,182]];
function tint(h){for(let i=1;i<TK.length;i++)if(h<=TK[i][0]){const a=TK[i-1],b=TK[i],t=(h-a[0])/(b[0]-a[0]);return[1,2,3].map(k=>lerp(a[k],b[k],t)|0)}return[98,110,182]}

/* ================= breeds ================= */
// sz 0 small 1 medium 2 large · c body · s secondary · e ear · t tail · p pattern · z zones · h periods · r rarity
const BR=[
{id:'lab',n:'Labrador',sz:1,c:'#e3b34f',s:'#f2d48a',e:'flop',t:'long',p:'solid',z:['lawn','pond'],h:'MD',r:0,d:'Will fetch literally anything. Twice.'},
{id:'golden',n:'Golden Retriever',sz:1,c:'#d9892b',s:'#f0b85c',e:'flop',t:'fluff',p:'chest',z:['pond','lawn'],h:'DE',r:0,d:'Has never met a puddle it did not love.'},
{id:'beagle',n:'Beagle',sz:1,c:'#b5692c',s:'#f5efe0',e:'flop',t:'long',p:'patch',col:'#3a6fd8',z:['meadow'],h:'MD',r:0,d:'Follows its nose first, asks questions later.'},
{id:'pug',n:'Pug',sz:0,c:'#dcb98a',s:'#dcb98a',m:'#3a2a22',ec:'#3a2a22',e:'fold',t:'curl',p:'solid',flat:1,col:'#3aa655',z:['lawn'],h:'DE',r:0,d:'Snores louder than it barks.'},
{id:'corgi',n:'Corgi',sz:0,c:'#e09a3c',s:'#fff4e0',e:'point',t:'stub',p:'mask',col:'#3a6fd8',z:['meadow'],h:'D',r:0,d:'Short legs, enormous confidence.'},
{id:'dachs',n:'Dachshund',sz:0,long:1,c:'#8a4a22',s:'#c47a3a',e:'long',t:'long',p:'tan',col:'#f2c230',z:['sand'],h:'DE',r:0,d:'Half a dog high, two dogs long.'},
{id:'poodle',n:'Poodle',sz:1,c:'#f4f0ea',s:'#ffffff',e:'long',t:'curl',p:'solid',f:1,col:'#e86aa8',z:['lawn'],h:'D',r:0,d:'Knows it is the best dressed dog here.'},
{id:'jack',n:'Jack Russell',sz:0,c:'#f7f2e8',s:'#a8612a',ec:'#a8612a',e:'fold',t:'stub',p:'eyepatch',z:['sand'],h:'M',r:0,d:'Runs on pure zoomies.'},
{id:'boxer',n:'Boxer',sz:1,c:'#c07a3a',s:'#f4ead8',m:'#3a2a22',e:'fold',t:'stub',p:'chest',flat:1,z:['lawn'],h:'M',r:0,d:'Wiggles its whole body to say hello.'},
{id:'mutt',n:'Scruffy Mutt',sz:1,c:'#8d7b68',s:'#b9a892',e:'fold',t:'long',p:'solid',f:1,w:14,col:'#f08a2a',z:['any'],h:'MDEN',r:0,d:'A bit of everything. 100% good dog.'},
{id:'dalm',n:'Dalmatian',sz:1,c:'#f8f8f4',s:'#22201e',ec:'#22201e',e:'flop',t:'long',p:'spots',z:['lawn'],h:'D',r:1,d:'Counted its own spots once. Lost track at 12.'},
{id:'collie',n:'Border Collie',sz:1,c:'#26211f',s:'#f6f2ea',e:'fold',t:'fluff',p:'mask',col:'#3ac2c2',z:['meadow'],h:'ME',r:1,d:'Is currently herding you. You just have not noticed.'},
{id:'husky',n:'Husky',sz:1,c:'#7d8794',s:'#f4f6f8',e:'point',t:'curl',p:'mask',eye:'#3aa0e8',col:'#3a6fd8',z:['woods'],h:'EN',r:1,d:'Very dramatic. Sings at the moon.'},
{id:'shep',n:'German Shepherd',sz:2,c:'#c98a3e',s:'#2a211c',m:'#2a211c',ec:'#2a211c',e:'point',t:'fluff',p:'saddle',z:['woods'],h:'EN',r:1,d:'On patrol. Always on patrol.'},
{id:'shiba',n:'Shiba Inu',sz:1,c:'#e2863a',s:'#fff1dc',e:'point',t:'curl',p:'mask',z:['woods'],h:'MD',r:1,d:'Much park. Very sniff. Wow.'},
{id:'kelpie',n:'Kelpie',sz:1,c:'#3a2418',s:'#b5713a',e:'point',t:'long',p:'tan',col:'#f2c230',z:['meadow'],h:'D',r:1,d:'True blue Aussie worker. Never, ever tired.'},
{id:'heeler',n:'Blue Heeler',sz:1,c:'#6f7f92',s:'#c98a4a',e:'point',t:'long',p:'speckle',z:['sand'],h:'DE',r:1,d:'Tough as old boots, soft as a sponge cake.'},
{id:'chi',n:'Chihuahua',sz:0,c:'#e6c89a',s:'#fff6e6',e:'bat',t:'long',p:'chest',col:'#e86aa8',z:['lawn'],h:'E',r:1,d:'Tiny dog. Giant opinions.'},
{id:'french',n:'French Bulldog',sz:0,c:'#4a4038',s:'#e8e0d4',e:'bat',t:'stub',p:'chest',flat:1,col:'#f2c230',z:['lawn'],h:'EN',r:1,d:'Part dog, part bat, part potato.'},
{id:'pom',n:'Pomeranian',sz:0,c:'#e8963c',s:'#f6c47a',e:'point',t:'fluff',p:'chest',f:1,z:['pond'],h:'EN',r:1,d:'A cloud that barks.'},
{id:'grey',n:'Greyhound',sz:2,slim:1,c:'#9a9aa2',s:'#e4e4e8',e:'fold',t:'long',p:'chest',col:'#8a4fd8',z:['sand'],h:'M',r:1,d:'Fastest couch potato in the world.'},
{id:'samo',n:'Samoyed',sz:2,c:'#ffffff',s:'#eef2f6',e:'point',t:'curl',p:'solid',f:1,col:'#3ac2c2',z:['pond'],h:'M',r:1,d:'Permanently smiling. Permanently shedding.'},
{id:'bern',n:'Bernese Mountain Dog',sz:2,c:'#221c1a',s:'#f6f2ea',brow:'#b5652a',e:'flop',t:'fluff',p:'mask',f:1,z:['woods'],h:'D',r:2,d:'A gentle giant who thinks it is a lap dog.'},
{id:'dobe',n:'Doberman',sz:2,slim:1,c:'#1e1a1a',s:'#a85e2a',e:'crop',t:'stub',p:'tan',col:'#8a8a92',z:['lawn'],h:'N',r:2,d:'Looks serious. Is secretly a big sook.'},
{id:'dane',n:'Great Dane',sz:2,tall:1,c:'#d2ae72',s:'#d2ae72',m:'#3a2a22',ec:'#3a2a22',e:'fold',t:'long',p:'solid',z:['meadow'],h:'N',r:2,d:'Technically a small horse.'},
{id:'sheep',n:'Old English Sheepdog',sz:2,c:'#b9bcc4',s:'#f8f8f8',e:'flop',t:'stub',p:'mask',f:1,shag:1,z:['pond'],h:'D',r:2,d:'Can it see? Nobody knows. It does not mind.'},
{id:'dingo',n:'Dingo',sz:1,c:'#d99a4e',s:'#f6e4c2',e:'point',t:'fluff',p:'chest',nocol:1,z:['sand'],h:'N',r:3,d:'A wild local, only seen after dark. Blink and it is gone.'},
{id:'wolf',n:'Irish Wolfhound',sz:2,tall:1,c:'#77706a',s:'#9a938c',e:'fold',t:'long',p:'solid',f:1,z:['woods'],h:'N',r:3,d:'An ancient giant that wanders the woods at night.'},
{id:'afghan',n:'Afghan Hound',sz:2,slim:1,c:'#e8d2a0',s:'#f6e8c8',m:'#5a4634',e:'long',t:'curl',p:'solid',f:1,col:'#8a4fd8',z:['meadow'],h:'M',r:3,d:'Glides through the morning mist like a shampoo ad.'}];
const BY={};BR.forEach(b=>BY[b.id]=b);
const RAR=[['Common','#6a8a3a'],['Uncommon','#2a7fd8'],['Rare','#a04fd8'],['Legendary','#e0851a']],RW=[60,22,7,1.6];

const NAMES=['Biscuit','Mango','Ziggy','Pepper','Banjo','Milo','Nugget','Waffles','Bindi','Koda','Roo','Digger','Pickles','Noodle','Bear','Luna','Scout','Olive','Tofu','Mochi','Rusty','Honey','Peanut','Matilda','Gizmo','Poppy'];
const OUTFITS=[
{id:'party',slot:'hat',n:'Party Hat',cost:0},{id:'flower',slot:'hat',n:'Daisy',cost:15},{id:'bow',slot:'hat',n:'Bow',cost:20},{id:'beanie',slot:'hat',n:'Beanie',cost:25},{id:'cowboy',slot:'hat',n:'Cowboy Hat',cost:40},{id:'tophat',slot:'hat',n:'Top Hat',cost:60},{id:'crown',slot:'hat',n:'Crown',cost:150},
{id:'bandana',slot:'neck',n:'Red Bandana',cost:0},{id:'bandanab',slot:'neck',n:'Blue Bandana',cost:15},{id:'bowtie',slot:'neck',n:'Bow Tie',cost:30},{id:'scarf',slot:'neck',n:'Scarf',cost:35},
{id:'shades',slot:'eyes',n:'Sunnies',cost:45},{id:'hearts',slot:'eyes',n:'Heart Specs',cost:55}];

/* ================= dog sprites ================= */
const SC={};
const okey=o=>o?'|'+(o.hat||'')+'|'+(o.neck||'')+'|'+(o.eyes||''):'';
function dogCols(b){const solid=b.p==='solid'||b.p==='spots'||b.p==='speckle'||b.p==='saddle'||b.p==='eyepatch';
 return{B:b.c,S2:b.s,D:shade(b.c,.8),E:b.ec||shade(b.c,.72),M:b.m||(solid?shade(b.c,1.12):b.s),P:solid?shade(b.c,1.1):b.s}}
function speck(x,b,X,Y,W,H){const r=rng(hash(b.id));
 if(b.p==='spots')for(let i=0;i<W*H/9;i++)px(x,X+(r()*W|0),Y+(r()*H|0),r()<.4?2:1,1,b.s);
 if(b.p==='speckle')for(let i=0;i<W*H/5;i++)px(x,X+(r()*W|0),Y+(r()*H|0),1,1,r()<.5?shade(b.c,1.3):shade(b.c,.7))}
function hatFront(x,id,hx,hy,hw){const cx=12;
 if(id==='party'){px(x,cx-3,hy-1,6,1,'#e84a6a');px(x,cx-2,hy-3,4,2,'#f2c230');px(x,cx-1,hy-5,2,2,'#3ac2c2');px(x,cx-1,hy-6,2,1,'#fff')}
 else if(id==='cowboy'){px(x,hx-2,hy-1,hw+4,1,'#8a5a2a');px(x,cx-3,hy-4,6,3,'#a8703a');px(x,cx-3,hy-2,6,1,'#5a2a0a');px(x,cx-1,hy-4,2,1,'#8a5a2a')}
 else if(id==='crown'){px(x,cx-4,hy-2,8,2,'#f2c230');px(x,cx-4,hy-4,1,2,'#f2c230');px(x,cx-1,hy-4,2,2,'#f2c230');px(x,cx+3,hy-4,1,2,'#f2c230');px(x,cx-1,hy-2,2,1,'#e84a6a')}
 else if(id==='beanie'){px(x,hx+1,hy-3,hw-2,3,'#3a6fd8');px(x,hx,hy,hw,1,'#f4f4f4');px(x,cx-1,hy-5,2,2,'#f4f4f4')}
 else if(id==='tophat'){px(x,cx-5,hy-1,10,1,'#2a2a32');px(x,cx-3,hy-6,6,5,'#2a2a32');px(x,cx-3,hy-2,6,1,'#d83a3a')}
 else if(id==='flower'){const fx=hx+hw-3;px(x,fx,hy-1,3,3,'#fff');px(x,fx+1,hy-2,1,5,'#fff');px(x,fx+1,hy,1,1,'#f2c230')}

   this.sp-=dt;if(this.sp<=0){this.sp=.32+R()*.5;const k=R();this.items.push({x:12+R()*(vw-24),y:-8,v:55+R()*30+(30-this.t)*2.2,k:k<.1?2:k<.28?1:0})}

   this.items=this.items.filter(i=>!i.hit&&i.y<gy+6)},
  draw(){drawScene();const gy=gY();for(const it of this.items)spr([SPR.bone,SPR.soap,SPR.gbone][it.k],it.x,it.y,2);
   spr(this.stun?dogFront(b,0,o,false):dogSide(b,this.mov?1+(G.time*10&1):0,o),this.x,gy+6,2,this.dir<0)},
  down(x){this.tx=x},move(x){this.tx=x}});
 else if(kind==='hop')MINI=Object.assign(base,{name:'Hurdle Hop',t:45,y:0,vy:0,lives:3,hs:[],sp:1.2,speed:95,inv:0,
  hud(){return`Hurdles ${this.score} · ${'♥'.repeat(this.lives)} · ${Math.ceil(this.t)}s`},
  update(dt){this.t-=dt;if(this.t<=0||this.lives<=0)return endMini(this);this.speed+=dt*2.2;this.inv=Math.max(0,this.inv-dt);
   this.vy+=560*dt;this.y+=this.vy*dt;if(this.y>0){this.y=0;this.vy=0}
   this.sp-=dt;if(this.sp<=0){this.sp=(105+R()*90)/this.speed;this.hs.push({x:vw+20})}

/* ================= update ================= */
let saveT=0;
function update(dt){G.time+=dt;
 if(G.state==='mini'){if(MINI){MINI.update(dt);updMh()}return}
 if(G.state==='photo'){updPhoto(dt);return}
 if(G.state==='trans'){const t=G.tr;t.t+=dt;t.d.hop=Math.max(0,t.d.hop-dt);if(t.t>.95)beginPhoto(t.d);return}
 if(G.state!=='world'||G.paused){P.moving=false;return}
 // player
 let mx=0,my=0;
 if(keys.arrowleft||keys.a)mx--;if(keys.arrowright||keys.d)mx++;if(keys.arrowup||keys.w)my--;if(keys.arrowdown||keys.s)my++;
 let str=1;
 if(ptr.id!==null&&ptr.drag){const dx=ptr.x-ptr.sx,dy=ptr.y-ptr.sy,m=Math.hypot(dx,dy);if(m>3){mx=dx/m;my=dy/m;str=clamp(m/16,.35,1);if(m>24){ptr.sx=ptr.x-mx*24;ptr.sy=ptr.y-my*24}}}
 const m=Math.hypot(mx,my);P.moving=m>0;
 if(m>0){mx/=m;my/=m;const sp=74*str*dt,nx=P.x+mx*sp,ny=P.y+my*sp;
  if(!blocked(nx,P.y))P.x=nx;if(!blocked(P.x,ny))P.y=ny;
  if(Math.abs(mx)>Math.abs(my)){P.dir=2;P.flip=mx<0}else P.dir=my<0?1:0;P.anim+=dt*str}else P.anim=0;
 // zone
 const z=zoneAt(P.x>>4,P.y>>4);if(z!==G.zone){if(G.zone)toast('~ '+ZNAME[z].replace(/^the /,'The ')+' ~',1800);G.zone=z}
 // dogs
 let near=null,nd=30;
 for(const d of dogs){d.life-=dt;d.hop=Math.max(0,d.hop-dt);const dx=P.x-d.x,dy=P.y-d.y,dist=Math.hypot(dx,dy);
  const on=Math.abs(dx)<vw/2+20&&Math.abs(dy)<vh/2+30;
  if(d.leave){d.t-=dt;d.happy=Math.max(0,d.happy-dt);if(d.happy<=0){d.st='walk';const a=Math.atan2(-dy,-dx),nx=d.x+Math.cos(a)*85*dt,ny=d.y+Math.sin(a)*85*dt;d.dir=Math.cos(a)>0?1:-1;if(!solidAt(nx,d.y-2))d.x=nx;if(!solidAt(d.x,ny-2))d.y=ny}
   if(d.t<=0&&(!on||d.t<-4))spawnDog(d,true);continue}
  if(dist<30){if(!d.near){d.near=true;d.hop=.25;if(on)sfx.pop()}d.st='sit';d.dir=dx>0?1:-1;if(dist<nd){nd=dist;near=d}}
  else{d.near=false;d.t-=dt;
   if(d.st==='sit'){if(d.t<=0){const tx=d.x+(R()*2-1)*56,ty=d.y+(R()*2-1)*56;if(!solidAt(tx,ty-2)&&reach[I(tx>>4,ty>>4)]){d.tx=tx;d.ty=ty;d.st='walk';d.t=4}else d.t=.5}}
   else{const ax=d.tx-d.x,ay=d.ty-d.y,am=Math.hypot(ax,ay);if(am<2||d.t<=0){d.st='sit';d.t=1.5+R()*4}else{const sp=(d.b.sz===0?30:24)*dt,nx=d.x+ax/am*sp,ny=d.y+ay/am*sp;if(solidAt(nx,ny-2)){d.st='sit';d.t=1}else{d.x=nx;d.y=ny;if(Math.abs(ax)>1)d.dir=ax>0?1:-1}}}}
  if(d.life<=0&&!on)spawnDog(d,true)}

 // buddy
 if(S.buddy&&S.dogs[S.buddy]){if(!BUD.on){BUD.on=true;BUD.x=P.x-14;BUD.y=P.y+2}
  BUD.hop=Math.max(0,BUD.hop-dt);const dx=P.x-BUD.x,dy=P.y-BUD.y,dist=Math.hypot(dx,dy);
  if(dist>160){BUD.x=P.x-12;BUD.y=P.y}else if(dist>20){const sp=Math.min(95,dist*3.2)*dt;BUD.x+=dx/dist*sp;BUD.y+=dy/dist*sp;BUD.moving=true;if(Math.abs(dx)>2)BUD.dir=dx>0?1:-1}else BUD.moving=false}else BUD.on=false;
 for(const f of G.fx)f.t-=dt;G.fx=G.fx.filter(f=>f.t>0);
 saveT+=dt;if(saveT>10){saveT=0;S.pos=[P.x,P.y];save()}}
function updPhoto(dt){const p=G.ph;if(!p)return;p.t+=dt;p.flash=Math.max(0,p.flash-dt*3);if(p.done)return;
 const Rg=Math.min(vw/2-14,80);
 if(p.pause>0){p.pause-=dt;if(p.pause<=0){p.tx=R()<.3?(R()*2-1)*8:(R()*2-1)*Rg;p.first=false}}
 else{const d=p.tx-p.x,st=p.v*dt;if(Math.abs(d)<=st){p.x=p.tx;p.pause=p.first?1.1:.25+R()*(.9-p.b.r*.15)}else{p.x+=Math.sign(d)*st;p.dir=Math.sign(d)}}}

/* ================= render ================= */
function spr(c,x,y,s,flip){const w=c.width*s,h=c.height*s,X=Math.round(x-w/2),Y=Math.round(y-(c.height-1)*s);
 if(flip){g.save();g.translate(X+w,Y);g.scale(-1,1);g.drawImage(c,0,0,w,h);g.restore()}else g.drawImage(c,X,Y,w,h)}
function shadow(x,y,rx){g.fillStyle='rgba(0,0,0,.22)';g.fillRect(Math.round(x-rx),Math.round(y-2),rx*2,3);g.fillRect(Math.round(x-rx+2),Math.round(y-3),rx*2-4,5)}
function drawScene(){const per=period(hourNow()),gy=gY(),sky={M:['#ffd6a0','#aee0ff'],D:['#6cc0ff','#c4e8ff'],E:['#f58f5c','#ffd48a'],N:['#10163a','#2a3470']}[per];

 if(per==='N'){const r=rng(9);for(let i=0;i<40;i++)px(g,r()*vw|0,r()*gy*.8|0,1,1,(G.time*2+i)%5<4?'#fff':'#8a94c8');disc(g,vw-26,22,9,'#f4f0d0');disc(g,vw-22,19,8,sky[0])}
 else{disc(g,vw-26,per==='D'?22:gy-40,9,per==='D'?'#fff4a0':'#ffe0a0');const cx=(G.time*4)%(vw+60)-30;ell(g,cx|0,30,14,4,'#fff');ell(g,(cx+8)|0,26,8,4,'#fff');ell(g,((cx+vw*.6)%(vw+60)-30)|0,52,11,3,'#fff')}
 for(let i=-1;i<vw/13+1;i++){disc(g,i*13+6,gy-5+((i*7)%3),10,'#2f7d32');disc(g,i*13+4,gy-9+((i*5)%3),5,'#3d9a3a')}
 px(g,0,gy-3,vw,vh-gy+3,'#4aa63c');px(g,0,gy-3,vw,1,'#3c8c38');
 const r=rng(3);for(let i=0;i<vw*(vh-gy)/160;i++){const a=r()*vw|0,b=gy+r()*(vh-gy)|0;px(g,a,b,1,2,'#62c04c');px(g,a+2,b,1,2,'#62c04c');px(g,a+1,b+1,1,1,'#62c04c')}
 if(per==='N'){g.fillStyle='rgba(20,26,90,.38)';g.fillRect(0,gy-18,vw,vh)}}
function drawPhoto(){const p=G.ph;drawScene();if(!p)return;const gy=gY()+12,cx=vw/2,b=p.b;
 const moving=p.pause<=0&&!p.done;shadow(cx+p.x,gy,18);
 spr(moving?dogSide(b,1+(G.time*10&1),null):dogFront(b,G.time*5&1,null,true),cx+p.x,gy-(moving?0:Math.abs(Math.sin(G.time*6))*2|0),3,p.dir<0);
 // letterbox + viewfinder
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,vw,14);g.fillRect(0,vh-14,vw,14);
 const fw=38,ft=Math.max(18,gy-104),fb=gy+10,L=cx-fw,Rr=cx+fw,inF=Math.abs(p.x)<33,col=inF?'#8fff6a':'#fff';
 const br=(x,y,sx,sy)=>{g.fillStyle='#000';g.fillRect(Math.min(x,x+11*sx)-1,y-1,13,3);g.fillRect(x-1,Math.min(y,y+11*sy)-1,3,13);g.fillStyle=col;g.fillRect(Math.min(x,x+11*sx),y,11,1);g.fillRect(x,Math.min(y,y+11*sy),1,11)};
 br(L,ft,1,1);br(Rr,ft,-1,1);br(L,fb,1,-1);br(Rr,fb,-1,-1);
 px(g,cx-3,(ft+fb>>1),7,1,col);px(g,cx,(ft+fb>>1)-3,1,7,col);
 if((G.time*2&1))px(g,6,5,4,4,'#e02a2a');
 if(p.flash>0){g.fillStyle=`rgba(255,255,255,${p.flash})`;g.fillRect(0,0,vw,vh)}
 if(p.t<.4)iris(cx,vh/2,p.t/.4)}
function iris(x,y,k){const r=Math.max(vw,vh)*k;g.fillStyle='#000';g.beginPath();g.rect(0,0,vw,vh);g.arc(x,y,Math.max(0,r),0,6.283,true);g.fill('evenodd')}
function render(){
 if(G.state==='photo')return drawPhoto();
 if(G.state==='mini'&&MINI)return MINI.draw();
 const cam=G.cam;cam.x=clamp(Math.round(P.x-vw/2),0,MW*TS-vw);cam.y=clamp(Math.round(P.y-10-vh/2),0,MH*TS-vh);
 g.drawImage(ground,cam.x,cam.y,vw,vh,0,0,vw,vh);
 // water sparkle
 for(let i=0;i<24;i++){const hsh=Math.sin(i*91.7+Math.floor(G.time*2+i*.37)*13.1)*43758.5,fx=(hsh-Math.floor(hsh))*vw|0,h2=hsh*1.7,fy=(h2-Math.floor(h2))*vh|0;if(map[I((fx+cam.x)>>4,(fy+cam.y)>>4)]===2)px(g,fx,fy,3,1,'#bfe8ff')}
 const L=[];
 for(const o of objs){if(o.y<cam.y-6)continue;if(o.y>cam.y+vh+56)break;if(o.x>cam.x-32&&o.x<cam.x+vw+32)L.push(o)}
 for(const d of dogs)if(Math.abs(d.x-P.x)<vw+40&&Math.abs(d.y-P.y)<vh+40)L.push(d);
 L.push(P);if(BUD.on)L.push(BUD);
 L.sort((a,b)=>a.y-b.y);
 for(const o of L){const x=o.x-cam.x,y=o.y-cam.y;
  if(o===P){shadow(x,y,6);const f=P.moving?[1,0,2,0][(P.anim*9|0)%4]:0;spr(playerSpr(P.dir,f),x,y,1,P.dir===2&&P.flip)}
  else if(o===BUD){const b=BY[S.buddy],dd=S.dogs[S.buddy];shadow(x,y,b.sz+5);spr(BUD.moving?dogSide(b,1+(G.time*10&1),dd):dogFront(b,G.time*3&1,dd,true),x,y-(BUD.hop>0?4:0),1,BUD.moving&&BUD.dir<0)}
  else if(o.b){const b=o.b,hop=o.hop>0?Math.sin(o.hop*12)*4:0;shadow(x,y,b.sz+5);
   spr(o.st==='walk'?dogSide(b,1+((G.time*8+o.seed)&1),null):dogFront(b,(o.near||o.happy>0)?(G.time*6&1):((G.time+o.seed)%3<.3?1:0),null,o.near||o.happy>0),x,y-Math.abs(hop),1,o.st==='walk'&&o.dir<0)}
  else if(o.k==='tree')g.drawImage(SPR.tree[o.v],x-17,y-44);
  else if(o.k==='bush')g.drawImage(SPR.bush,x-9,y-14);

  else if(o.k==='fountain'){g.drawImage(SPR.fountain,x-29,y-52);const t=G.time*6|0;for(let i=0;i<5;i++){const a=(i*1.3+t*.7)%6.28;px(g,x+Math.cos(a)*(6+(t+i)%5)|0,y-36+((t*3+i*7)%14),1,2,'#dff4ff')}}}
 // day / night
 const h=hourNow(),tc=tint(h),night=clamp((255-(tc[0]+tc[1])/2)/150,0,1);
 if(night>0.01){g.globalCompositeOperation='multiply';g.fillStyle=`rgb(${tc[0]},${tc[1]},${tc[2]})`;g.fillRect(0,0,vw,vh);g.globalCompositeOperation='source-over'}
 if(night>.25){g.globalCompositeOperation='lighter';
  for(const[lx,ly]of lamps){const x=lx-cam.x,y=ly-cam.y;if(x<-50||y<-50||x>vw+50||y>vh+50)continue;for(const rr of[48,42,36,30,24,18,12,6])disc(g,x|0,y|0,rr,`rgba(255,206,120,${.065*night})`)}
  g.globalCompositeOperation='source-over';
  for(let i=0;i<14;i++){const fx=(Math.sin(i*12.9)*.5+.5)*vw+Math.sin(G.time*.7+i)*14,fy=(Math.cos(i*7.3)*.5+.5)*vh+Math.cos(G.time*.9+i*2)*10;if(Math.sin(G.time*2+i*1.7)>-.2)px(g,fx|0,fy|0,1,1,'#f8ff9a')}}
 // bubbles
 for(const d of dogs){if(!d.near&&d.happy<=0)continue;const x=d.x-cam.x,y=d.y-cam.y-[25,27,32][d.b.sz]-(d.b.tall?3:0);
  if(d.happy>0)g.drawImage(SPR.heart,Math.round(x-4),Math.round(y-4-(2-d.happy)*6));
  else g.drawImage(S.dogs[d.b.id]?SPR.heartB:SPR.bang,Math.round(x-5),Math.round(y-12+(d===G.near?Math.sin(G.time*6)*1.5:0)))}
 for(const f of G.fx)g.drawImage(SPR.heart,Math.round(f.x-cam.x-4),Math.round(f.y-cam.y-(1-f.t)*14));
 // joystick
 if(ptr.id!==null&&ptr.drag&&G.state==='world'){g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.beginPath();g.arc(ptr.sx,ptr.sy,14,0,6.283);g.stroke();g.fillStyle='rgba(255,255,255,.55)';const dx=ptr.x-ptr.sx,dy=ptr.y-ptr.sy,m=Math.max(1,Math.hypot(dx,dy)),k=Math.min(14,m)/m;g.beginPath();g.arc(ptr.sx+dx*k,ptr.sy+dy*k,5,0,6.283);g.fill()}
 if(G.state==='trans'){const t=G.tr.t,d=G.tr.d;if(t<.4){if((t*20&1)){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,0,vw,vh)}}else iris(d.x-cam.x,d.y-cam.y-10,1-(t-.4)/.5)}}

 if(S.pos&&!blocked(S.pos[0],S.pos[1])){P.x=S.pos[0];P.y=S.pos[1]}
